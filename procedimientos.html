<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Procedimientos base - Consulta Dental Renato</title>
    <link rel="icon" href="./assets/icons/app-icon.ico" sizes="any" />
    <link rel="icon" href="./assets/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/design-system.css" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="stylesheet" href="./assets/ui-polish.css" />
    <link rel="stylesheet" href="./assets/ui-polish-workflows.css" />
    <link rel="stylesheet" href="./assets/ui-polish-patient.css" />
    <link rel="stylesheet" href="./assets/ui-polish-layout.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegacion principal" data-navigation></aside>

      <main class="main-content module-page">
        <header class="topbar"><div><span class="eyebrow">Catalogo</span><h1>Procedimientos base</h1></div><button class="text-button primary-action" id="newProcedure" type="button">Nuevo procedimiento</button></header>
        <p class="form-helper">Define los procedimientos disponibles al asignar tratamientos y agendar citas. Los cambios de precio se aplican a nuevos tratamientos; los presupuestos existentes se conservan.</p>
        <section class="module-layout procedure-layout">
          <section class="detail-card wide-card" aria-label="Catalogo de procedimientos">
            <div class="section-heading"><h2>Catalogo de procedimientos</h2><span class="pill" id="procedureCount"></span></div>
            <label class="procedure-search">Buscar procedimiento<input id="procedureSearch" type="search" placeholder="Nombre o descripcion" /></label>
            <div class="procedure-list" id="procedureList"><p class="empty-state">Cargando procedimientos...</p></div>
            <button class="text-button" id="retryProcedures" type="button" hidden>Reintentar carga</button>
          </section>
          <aside class="detail-card">
            <h2 id="procedureFormTitle">Nuevo procedimiento</h2>
            <form class="compact-form" id="procedureForm">
              <label>Nombre del procedimiento<input name="name" maxlength="160" required placeholder="Ej. Restauracion de resina" /></label>
              <label>Descripcion<textarea name="description" rows="4" placeholder="Describe el procedimiento"></textarea></label>
              <label>Precio base (CLP)<input name="default_price" type="number" min="0" step="1" required placeholder="0" /></label>
              <div class="inline-actions"><button class="text-button primary-action" type="submit">Crear procedimiento</button><button class="text-button" id="cancelProcedureEdit" type="button" hidden>Cancelar edicion</button></div>
              <p class="form-status" id="procedureStatus" role="status" aria-live="polite"></p>
            </form>
          </aside>
        </section>
      </main>
    </div>
    <script src="./assets/navigation.js"></script>
    <script src="./assets/api.js"></script>
    <script src="./assets/procedimientos.js"></script>
  </body>
</html>
