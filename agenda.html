<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agenda - Consulta Dental Renato</title>
    <link rel="icon" href="./assets/icons/app-icon.ico" sizes="any" />
    <link rel="icon" href="./assets/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/design-system.css" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="stylesheet" href="./assets/ui-polish.css" />
    <link rel="stylesheet" href="./assets/ui-polish-workflows.css" />
    <link rel="stylesheet" href="./assets/ui-polish-patient.css" />
    <link rel="stylesheet" href="./assets/ui-polish-layout.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegacion principal" data-navigation></aside>

      <main class="main-content module-page">
        <header class="topbar"><div><span class="eyebrow">Agenda</span><h1>Jornada de atenciones</h1></div></header>
        <section class="schedule-board">
          <section class="detail-card wide-card agenda-day-card">
            <div class="section-heading">
              <div><span class="eyebrow">Jornada</span><h2 id="calendarTitle">Hoy</h2><p class="section-subtitle" id="agendaCount" aria-live="polite"></p></div>
              <div class="inline-actions">
                <button class="text-button" id="goTodayBtn" type="button">Hoy</button>
              </div>
            </div>
            <div class="agenda-date-tools">
              <button class="text-button" id="agendaPrevious" type="button" aria-label="Semana anterior">← Semana anterior</button>
              <label>Ir al día <input id="agendaDatePicker" type="date" /></label>
              <button class="text-button" id="agendaNext" type="button" aria-label="Semana siguiente">Semana siguiente →</button>
            </div>
            <div class="mini-calendar agenda-date-filter" id="miniCalendar" aria-label="Filtrar agenda por dia"></div>
            <div class="agenda-calendar-legend-filter">
              <div class="appointment-status-legend" aria-label="Leyenda de estados de citas">
                <span><i class="legend-dot scheduled"></i>Confirmada</span>
                <span><i class="legend-dot attended"></i>Atendida</span>
                <span><i class="legend-dot missed"></i>No asistió</span>
                <span><i class="legend-dot cancelled"></i>Cancelada</span>
              </div>
              <label class="agenda-status-filter">Estado<select id="agendaStatusFilter" aria-label="Filtrar citas por estado">
                <option value="">Todos</option>
                <option value="scheduled">Confirmadas</option>
                <option value="attended">Atendidas</option>
                <option value="missed">No asistió</option>
                <option value="cancelled">Canceladas</option>
              </select></label>
            </div>
            <div class="day-timeline" id="dayTimeline"><p class="empty-state">Cargando citas…</p></div>
          </section>
        </section>
      </main>
    </div>
    <script src="./assets/navigation.js"></script>
    <script src="./assets/api.js"></script>
    <script src="./assets/agenda.js"></script>
  </body>
</html>
