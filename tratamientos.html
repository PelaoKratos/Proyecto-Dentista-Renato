<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tratamientos - Consulta Dental Renato</title>
    <link rel="icon" href="./assets/icons/app-icon.ico" sizes="any" />
    <link rel="icon" href="./assets/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/design-system.css" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="stylesheet" href="./assets/ui-polish.css" />
    <link rel="stylesheet" href="./assets/ui-polish-workflows.css" />
    <link rel="stylesheet" href="./assets/ui-polish-patient.css" />
    <link rel="stylesheet" href="./assets/ui-polish-layout.css" />
    <link rel="stylesheet" href="./assets/ui-polish-treatments.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegación principal" data-navigation></aside>

      <main class="main-content module-page treatment-page">
        <header class="topbar">
          <div><span class="eyebrow">Gestión clínica</span><h1>Tratamientos</h1></div>
          <button class="text-button primary-action" id="focusTreatmentForm" type="button">Crear tratamiento</button>
        </header>

        <section class="module-layout treatment-layout">
          <section class="detail-card treatment-overview" aria-labelledby="treatmentListTitle">
            <div class="section-heading">
              <div><span class="eyebrow">Seguimiento</span><h2 id="treatmentListTitle">Tratamientos de pacientes</h2></div>
            </div>
            <div class="treatment-toolbar">
              <label class="treatment-search"><span>Buscar</span><input id="treatmentSearch" type="search" placeholder="Paciente, tratamiento o pieza" autocomplete="off" /></label>
              <label class="treatment-filter"><span>Mostrar</span><select id="treatmentFilter"><option value="active">Activos</option><option value="all">Todos</option><option value="completed">Finalizados</option><option value="cancelled">Cancelados</option></select></label>
            </div>
            <p class="treatment-result-count" id="treatmentResultCount" aria-live="polite"></p>
            <div class="treatment-list" id="treatmentsGrid" aria-live="polite"><p class="empty-state">Cargando tratamientos…</p></div>
          </section>

          <aside class="detail-card treatment-sidebar" aria-label="Acciones de tratamientos">
            <details class="treatment-create-details" id="treatmentCreateDetails">
              <summary><span><strong>Asignar tratamiento</strong><small>Registrar un plan para un paciente</small></span></summary>
              <form class="compact-form treatment-form" id="newTreatmentForm">
                <label>Paciente<select name="patient_id" id="newTreatmentPatient" required></select></label>
                <label>Procedimiento base<select name="catalog_treatment_id" id="newTreatmentCatalog"><option value="">Personalizado</option></select></label>
                <label class="treatment-form-wide">Nombre del tratamiento<input name="title" id="newTreatmentTitle" placeholder="Ej. Restauración molar" required /></label>
                <details class="treatment-extra-fields">
                  <summary>Datos opcionales</summary>
                  <div class="treatment-extra-grid">
                    <label>Pieza dental<input name="tooth_code" placeholder="Ej. 36" /></label>
                    <label>Presupuesto<input name="estimated_price" id="newTreatmentPrice" type="number" min="0" placeholder="0" /></label>
                    <label class="treatment-form-wide">Estado inicial<select name="status"><option value="planned">Planificado</option><option value="in_progress">En curso</option><option value="completed">Completado</option><option value="cancelled">Cancelado</option></select></label>
                    <label class="treatment-form-wide">Plan clínico<textarea name="plan_notes" placeholder="Agrega una nota solo si es necesaria"></textarea></label>
                  </div>
                </details>
                <button class="text-button primary-action" type="submit">Guardar tratamiento</button>
                <p class="form-status" id="newTreatmentStatus" aria-live="polite"></p>
              </form>
            </details>

            <section class="treatment-catalog-panel" aria-labelledby="treatmentCatalogTitle">
              <div class="section-heading">
                <div><span class="eyebrow">Catálogo</span><h2 id="treatmentCatalogTitle">Procedimientos base</h2></div>
                <a class="text-button link-button" href="./procedimientos.html">Administrar</a>
              </div>
              <details class="treatment-catalog-details">
                <summary>Ver procedimientos disponibles</summary>
                <div class="catalog-list" id="catalogList"><p class="empty-state">Cargando procedimientos…</p></div>
              </details>
            </section>
          </aside>
        </section>
      </main>
    </div>
    <script src="./assets/navigation.js"></script>
    <script src="./assets/api.js"></script>
    <script src="./assets/tratamientos.js"></script>
  </body>
</html>
